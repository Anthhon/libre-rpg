{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LIBRE RPG — Bem-vindo</title>
        {# <link rel="stylesheet" href="{% static 'css/style.css' %}"> #}
    </head>
    <body>
        {# Cabeçalho do formulário de login #}
        <h1>Libre RPG</div>
        <h2>Login do sistema</span>

        {# Login form #}
        <form id="welcome-form" method="post" novalidate>
            {% csrf_token %}
            {{ form }}
            <button type="submit" id="submit-btn">Entrar na Mesa</button>
        </form>

        {# Footer #}
        <footer>
            <small>
                <p>Sistema FOSS de TTRPG</p>
            </small>
        </footer>

        <script src="{% static 'js/script.js'%}"></script>
    </body>
</html>
